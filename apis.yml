name: Riiico
description: RIIICO is a Duesseldorf-based industrial software company building 3D-AI
  tools that digitalize the factory shop floor. Its platform turns reality scans (point
  clouds) of existing plants into CAD-ready, pre-classified 3D models, cutting 3D modeling
  time by up to 80% and accelerating factory retrofit, robot programming, and simulation.
  RIIICO integrates with NVIDIA Omniverse (OpenUSD) and Siemens Xcelerator, and counts
  Siemens, Volvo, and Schaeffler among its customers. It won the Siemens Inventors
  of the Year Award 2024 and is backed by Earlybird, PiLabs, and seed + speed. No public
  API, SDK, or developer documentation surface was found during enrichment.
